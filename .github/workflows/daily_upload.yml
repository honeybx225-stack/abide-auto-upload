name: Daily Reels Upload

on:
  schedule:
    - cron: '30 0 * * *'  # 08:30 台灣時間 (UTC+8)
  workflow_dispatch:       # 允許手動觸發

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run auto upload
        run: python auto_upload.py
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_ID: ${{ secrets.META_IG_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}

      - name: Commit updated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add abide.db
          git diff --staged --quiet || git commit -m "auto: uploaded $(date '+%Y-%m-%d')"
          git push

      - name: 通知上傳失敗
        if: failure()
        run: |
          curl -s -X POST "https://ntfy.sh/abide-apple-upload-alert-2026" \
            -H "Title: ❌ Abide 上傳失敗" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -d "$(date '+%Y-%m-%d') 上傳失敗，請更新 Meta Token 或查看 GitHub Actions 記錄。"
