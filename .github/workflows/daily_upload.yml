name: Daily Reels Upload

on:
  schedule:
    - cron: '30 0 * * *'  # 08:30 台灣時間 (UTC+8)
  workflow_dispatch:       # 允許手動觸發

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run auto upload
        run: python abide_system/auto_upload.py
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_ID: ${{ secrets.META_IG_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}

      - name: Commit updated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add abide_system/abide.db
          git diff --staged --quiet || git commit -m "auto: uploaded $(date '+%Y-%m-%d')"
          git push
